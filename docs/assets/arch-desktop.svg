      <rect x="54" y="42" width="268" height="270" rx="10" fill="#121212" stroke="#454545"/>
      <path d="M55 65h266" stroke="#313131"/>
      <g fill="#858585"><circle cx="65" cy="54" r="3"/><circle cx="76" cy="54" r="3"/><circle cx="87" cy="54" r="3"/></g>
      <g font-family="DejaVu Sans Mono, monospace" font-size="10"><text x="71" y="91" fill="#e1e1e1">roman@arch ~</text><text x="71" y="115" fill="#a2a2a2">$ arch-config check</text><text x="71" y="139" fill="#6e6e6e">Manifest and syntax checks passed.</text><text x="71" y="175" fill="#a2a2a2">$ desktop-dock show</text><path d="M72 196h6" stroke="#ddd" stroke-width="2"/></g>
      <g fill="#303030"><rect x="71" y="245" width="165" height="4" rx="2"/><rect x="71" y="258" width="115" height="4" rx="2"/><rect x="71" y="271" width="141" height="4" rx="2"/></g>

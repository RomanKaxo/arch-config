<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="460" viewBox="0 0 1200 460" role="img" aria-labelledby="title desc">
  <title id="title">Arch. Po svém. — Romanův grafitový desktop</title>
  <desc id="desc">Černý a grafitový banner s nákresem plochy: spojený horní a levý panel, dlaždicová okna a jemné vlny.</desc>
  <defs>
    <linearGradient id="background" x2="1" y2="1"><stop stop-color="#070707"/><stop offset="1" stop-color="#161616"/></linearGradient>
    <linearGradient id="surface" x2="0" y2="1"><stop stop-color="#202020"/><stop offset="1" stop-color="#111111"/></linearGradient>
    <radialGradient id="glow"><stop stop-color="#666" stop-opacity=".13"/><stop offset="1" stop-color="#666" stop-opacity="0"/></radialGradient>
    <clipPath id="frame"><rect x="1" y="1" width="1198" height="458" rx="24"/></clipPath>
    <pattern id="waves" width="8" height="32" patternUnits="userSpaceOnUse"><path d="M2 8v16M6 13v6" stroke="#a0a0a0" stroke-width="2" stroke-linecap="round"/></pattern>
  </defs>
  <g clip-path="url(#frame)">
    <rect width="1200" height="460" fill="url(#background)"/>
    <ellipse cx="1000" cy="140" rx="490" ry="370" fill="url(#glow)"/>
    <g fill="none" stroke="#8a8a8a" stroke-opacity=".09"><path d="M-100 460C240 180 530 650 1260 210"/><path d="M-100 478C250 198 540 668 1270 228"/><path d="M-100 496C260 216 550 686 1280 246"/></g>
    <g font-family="Inter, DejaVu Sans, sans-serif">
      <circle cx="65" cy="67" r="4" fill="#c4c4c4"/>
      <text x="81" y="73" fill="#a4a4a4" font-size="13" letter-spacing="3">ROMAN / ARCH CONFIG</text>
      <text x="60" y="175" fill="#eeeeee" font-size="58" font-weight="700" letter-spacing="-2">Arch. Po svém.</text>
      <text x="64" y="219" fill="#a7a7a7" font-size="20">Černá. Grafit. Místo pro práci.</text>
      <text x="64" y="260" fill="#777777" font-size="15">Hyprland · Quickshell · Waybar</text>
      <g font-size="12" fill="#bababa">
        <rect x="64" y="302" width="98" height="32" rx="16" fill="#191919" stroke="#333"/><text x="113" y="323" text-anchor="middle">LEVÝ PANEL</text>
        <rect x="172" y="302" width="96" height="32" rx="16" fill="#191919" stroke="#333"/><text x="220" y="323" text-anchor="middle">BLUR 10</text>
        <rect x="278" y="302" width="114" height="32" rx="16" fill="#191919" stroke="#333"/><text x="335" y="323" text-anchor="middle">VLASTNÍ PANELY</text>
      </g>
      <text x="64" y="397" fill="#686868" font-family="JetBrains Mono, DejaVu Sans Mono, monospace" font-size="12">configure  →  sync  →  restore</text>
    </g>

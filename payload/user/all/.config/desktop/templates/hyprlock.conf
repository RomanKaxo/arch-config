general {
    hide_cursor = true
}
animations {
    enabled = true
    bezier = calm, 0.22, 1, 0.36, 1
    animation = fadeIn, 1, 2.2, calm
    animation = fadeOut, 1, 1.6, calm
}
background {
    monitor =
    path = @HOME@/.config/desktop-setup-login/background.png
    color = rgb({{bg}})
    blur_passes = 2
    blur_size = 5
    brightness = 0.85
}
shape {
    monitor =
    size = 540, 440
    color = rgba({{bg}}dd)
    rounding = 24
    border_size = 1
    border_color = rgba({{border}}aa)
    position = 0, -50
    halign = center
    valign = center
    zindex = 0
}
shape {
    monitor =
    size = 104, 104
    color = rgb({{selection}})
    rounding = -1
    border_size = 1
    border_color = rgba({{accent}}cc)
    position = 0, 80
    halign = center
    valign = center
    zindex = 1
}
label {
    monitor =
    text = $TIME
    color = rgb({{text}})
    font_size = 82
    font_family = Inter Variable Light
    position = 0, 330
    halign = center
    valign = center
}
label {
    monitor =
    text = cmd[update:60000] date +"%A, %d %B %Y"
    color = rgb({{muted}})
    font_size = 13
    font_family = Inter Variable
    position = 0, 250
    halign = center
    valign = center
}
label {
    monitor =
    text = R
    color = rgb({{text}})
    font_size = 32
    font_family = Inter Variable
    position = 0, 80
    halign = center
    valign = center
    zindex = 2
}
label {
    monitor =
    text = roman
    color = rgb({{text}})
    font_size = 22
    font_family = Inter Variable
    position = 0, -3
    halign = center
    valign = center
    zindex = 2
}
label {
    monitor =
    text = good things take time.
    color = rgb({{muted}})
    font_size = 11
    font_family = Inter Variable
    position = 0, -42
    halign = center
    valign = center
    zindex = 2
}
input-field {
    monitor =
    size = 430, 58
    outline_thickness = 1
    rounding = 29
    outer_color = rgba({{accent}}77)
    inner_color = rgba({{surface}}ee)
    font_color = rgb({{text}})
    check_color = rgb({{accent}})
    fail_color = rgb({{red}})
    capslock_color = rgb({{yellow}})
    font_family = Inter Variable
    placeholder_text = Enter your password…
    fail_text = $PAMFAIL
    fade_on_empty = false
    dots_size = 0.22
    dots_spacing = 0.25
    position = 0, -110
    halign = center
    valign = center
    zindex = 2
}
label {
    monitor =
    text = ☾   Sleep
    color = rgb({{muted}})
    font_size = 13
    font_family = Inter Variable
    position = 0, -205
    halign = center
    valign = center
    onclick = systemctl suspend
    zindex = 2
}
label {
    monitor =
    text = HYPRLAND  /  MIDNIGHT
    color = rgb({{muted}})
    font_size = 11
    font_family = Inter Variable
    position = 40, -36
    halign = left
    valign = top
}
label {
    monitor =
    text = $LAYOUT  ·  Alt + Shift
    color = rgb({{muted}})
    font_size = 11
    font_family = Inter Variable
    position = -40, 36
    halign = right
    valign = bottom
}

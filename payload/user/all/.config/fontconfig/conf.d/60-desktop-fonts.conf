<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<fontconfig>
 <alias binding="strong"><family>sans-serif</family><prefer><family>Inter Variable</family><family>Noto Sans</family><family>Noto Color Emoji</family></prefer></alias>
 <alias binding="strong"><family>serif</family><prefer><family>Noto Serif</family><family>Noto Color Emoji</family></prefer></alias>
 <alias binding="strong"><family>monospace</family><prefer><family>JetBrainsMono Nerd Font</family><family>Noto Color Emoji</family></prefer></alias>
 <alias binding="strong"><family>emoji</family><prefer><family>Noto Color Emoji</family></prefer></alias>
 <alias binding="strong"><family>Apple Color Emoji</family><prefer><family>Noto Color Emoji</family></prefer></alias>
 <alias binding="strong"><family>Segoe UI Emoji</family><prefer><family>Noto Color Emoji</family></prefer></alias>
 <match target="pattern"><test name="family" compare="eq"><string>sans-serif</string></test><edit name="family" mode="append"><string>Noto Color Emoji</string></edit></match>
 <match target="pattern"><test name="family" compare="eq"><string>monospace</string></test><edit name="family" mode="append"><string>Noto Color Emoji</string></edit></match>
</fontconfig>

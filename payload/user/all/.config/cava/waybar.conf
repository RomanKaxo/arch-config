# Skutečné spektrum přehrávaného výstupu, ne mikrofonu.
[general]
framerate = 30
bars = 48
autosens = 1
lower_cutoff_freq = 50
higher_cutoff_freq = 10000
sleep_timer = 3

[input]
method = pulse
source = auto

[output]
method = raw
raw_target = /dev/stdout
data_format = ascii
ascii_max_range = 1000
bar_delimiter = 59
frame_delimiter = 10
# Stereo rozloží basy do středu a výšky k oběma krajům.
channels = stereo

[smoothing]
monstercat = 0
waves = 0
noise_reduction = 65

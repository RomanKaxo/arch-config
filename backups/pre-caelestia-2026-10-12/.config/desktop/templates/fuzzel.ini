[main]
font=Inter Variable:size=12
terminal=kitty -e
icon-theme=Colloid-Purple-Nord-Dark
prompt=❯  
placeholder=Search applications…
layer=overlay
width=42
lines=8
horizontal-pad=22
vertical-pad=18
inner-pad=12
line-height=30

[colors]
background={{surface}}f2
text={{text}}ff
prompt={{accent}}ff
placeholder={{muted}}ff
input={{text}}ff
match={{accent}}ff
selection={{selection}}ff
selection-text={{text}}ff
selection-match={{bright}}ff
border={{border}}ee

[border]
width=1
radius=16

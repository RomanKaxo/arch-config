general {
    hide_cursor = true
}
background {
    monitor =
    path = /home/roman/.local/share/wallpapers/current.png
    color = rgb(0b0c16)
    blur_passes = 2
    blur_size = 4
    brightness = 0.7
}
label {
    monitor =
    text = $TIME
    color = rgb(eef0ff)
    font_size = 76
    font_family = Noto Sans
    position = 0, 170
    halign = center
    valign = center
}
label {
    monitor =
    text = cmd[update:60000] date +"%A, %d %B"
    color = rgb(a3a8c5)
    font_size = 18
    font_family = Noto Sans
    position = 0, 85
    halign = center
    valign = center
}
input-field {
    monitor =
    size = 340, 54
    outline_thickness = 2
    rounding = 14
    outer_color = rgba(9586ff99)
    inner_color = rgba(131629ee)
    font_color = rgb(eef0ff)
    check_color = rgb(9586ff)
    fail_color = rgb(d183a2)
    capslock_color = rgb(d2b987)
    font_family = Noto Sans
    placeholder_text = Password
    fail_text = $PAMFAIL
    fade_on_empty = false
    dots_size = 0.22
    dots_spacing = 0.25
    position = 0, -35
    halign = center
    valign = center
}
label {
    monitor =
    text = $USER  ·  $LAYOUT
    color = rgb(a3a8c5)
    font_size = 13
    font_family = Noto Sans
    position = 0, -95
    halign = center
    valign = center
}
label {
    monitor =
    text = Alt + Shift to switch keyboard layout
    color = rgb(a3a8c5)
    font_size = 12
    font_family = Noto Sans
    position = 0, 45
    halign = center
    valign = bottom
}

general {
    hide_cursor = true
}
animations {
    enabled = true
    bezier = calm, 0.22, 1, 0.36, 1
    animation = fadeIn, 1, 2.2, calm
    animation = fadeOut, 1, 1.6, calm
}
background {
    monitor =
    path = /home/roman/.config/desktop-setup-login/background.png
    color = rgb(090a10)
    blur_passes = 2
    blur_size = 5
    brightness = 0.85
}
shape {
    monitor =
    size = 540, 440
    color = rgba(090a10dd)
    rounding = 24
    border_size = 1
    border_color = rgba(303245aa)
    position = 0, -50
    halign = center
    valign = center
    zindex = 0
}
shape {
    monitor =
    size = 104, 104
    color = rgb(202239)
    rounding = -1
    border_size = 1
    border_color = rgba(9283bdcc)
    position = 0, 80
    halign = center
    valign = center
    zindex = 1
}

general {
    hide_cursor = true
}
background {
    monitor =
    path = /home/roman/.local/share/wallpapers/current.png
    color = rgb(15110f)
    blur_passes = 2
    blur_size = 4
    brightness = 0.7
}
label {
    monitor =
    text = $TIME
    color = rgb(e9dfd2)
    font_size = 76
    font_family = Noto Sans
    position = 0, 170
    halign = center
    valign = center
}
label {
    monitor =
    text = cmd[update:60000] date +"%A, %d %B"
    color = rgb(b6a494)
    font_size = 18
    font_family = Noto Sans
    position = 0, 85
    halign = center
    valign = center
}
input-field {
    monitor =
    size = 340, 54
    outline_thickness = 2
    rounding = 14
    outer_color = rgba(c5aa8499)
    inner_color = rgba(231d18ee)
    font_color = rgb(e9dfd2)
    check_color = rgb(c5aa84)
    fail_color = rgb(c98484)
    capslock_color = rgb(c7b78a)
    font_family = Noto Sans
    placeholder_text = Password
    fail_text = $PAMFAIL
    fade_on_empty = false
    dots_size = 0.22
    dots_spacing = 0.25
    position = 0, -35
    halign = center
    valign = center
}
label {
    monitor =
    text = $USER  ·  $LAYOUT
    color = rgb(b6a494)
    font_size = 13
    font_family = Noto Sans
    position = 0, -95
    halign = center
    valign = center
}
label {
    monitor =
    text = Alt + Shift to switch keyboard layout
    color = rgb(b6a494)
    font_size = 12
    font_family = Noto Sans
    position = 0, 45
    halign = center
    valign = bottom
}
